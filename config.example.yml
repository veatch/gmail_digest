# Copy to config.yml and edit. Commit config.yml in your private repo
# (it has no secrets — those stay in GitHub Actions repository secrets).

# Which mail to consider each run (IMAP). The bot only writes one
# Gmail label after a successful Telegram send; it does not delete,
# archive, or change read/unread.
mail:
  # IMAP folder / Gmail label to search. Examples: INBOX, newsletters
  label: INBOX

  # Applied after a sender's digest is sent. Next run skips mail that
  # already has this label. Create it in Gmail if it is not auto-created.
  processed_label: digest/processed

  # Required. Each entry is one LLM call and one Telegram message
  # when that sender has unlabeled mail. `name` is the human-facing label;
  # a safe state-file slug is derived from it and replies use the label.
  senders:
    - name: axios
      from: newsletter@example.com
    # - name: localpaper
    #   from: city@localpaper.com

  # Safety bound for unlabeled mail, not the uniqueness key.
  lookback_days: 3

  # Hard cap on messages processed per run (across a sender).
  max_messages: 20

# Pull app code from the public template at the start of each Action run.
# Template copies are not forks — without this, they never receive updates.
upstream:
  # Set true in your private repo after pointing url at the public template.
  auto_sync: false

  url: https://github.com/veatch/gmail_digest.git
  # Prefer a release tag once they exist; main is fine while iterating.
  ref: main

  # Application paths replaced from upstream. Workflow files stay in the
  # instance repo; digest.yml calls the reusable workflow in the template.
  # state/ and config.yml are never listed.
  paths:
    - src
    - scripts
    - docs
    - pyproject.toml
    - uv.lock
    - config.example.yml
    - .python-version
    - .gitignore
