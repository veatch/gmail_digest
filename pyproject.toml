[project]
name = "digest"
version = "0.1.0"
description = "Newsletter digest bot: Gmail → Telegram"
requires-python = ">=3.12"
dependencies = ["google-genai>=1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digest"]
